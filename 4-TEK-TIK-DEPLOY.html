  await githubJson(`https://api.github.com/repos/${owner}/${repo}/contents/${apiPath}`, token, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: `Update ${file.path}`, content: file.content, branch, ...(sha ? { sha } : {}) }) });
}
async function deploy() {
  const token = tokenInput.value.trim();
  if (!token) { setStatus("Token bos. GitHub token yapistirip tekrar dene."); return; }
  deployButton.disabled = true;
  setStatus(`Deploy basladi. ${files.length} dosya yuklenecek.`);
  try {
    await githubJson(`https://api.github.com/repos/${owner}/${repo}`, token);
    log("Repo erisimi tamam.");
    for (let i = 0; i < files.length; i += 1) { const file = files[i]; log(`[${i + 1}/${files.length}] ${file.path} yukleniyor...`); await uploadFile(file, token); }
    log("Tum dosyalar yuklendi."); log("GitHub Pages 1-3 dakika icinde guncellenir."); log(siteUrl);
  } catch (error) {
    log(`HATA: ${error.message}`); log("Token classic ise repo izni, fine-grained ise Contents Read/Write izni ve Otel-Y-netim- repo erisimi gerekiyor.");
  } finally { deployButton.disabled = false; }
}
deployButton.addEventListener("click", deploy);
</script>
